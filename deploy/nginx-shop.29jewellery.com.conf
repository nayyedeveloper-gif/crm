server {
    listen 80;
    listen [::]:80;
    server_name shop.29jewellery.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.29jewellery.com;

    # Managed by Certbot — placeholders until certbot runs
    ssl_certificate /etc/letsencrypt/live/shop.29jewellery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.29jewellery.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 40m;

    # Sales Vite SPA — serve from disk (Next only serves public files from last build)
    location = /sales-app {
        return 301 /sales-app/index.html;
    }
    location /sales-app/ {
        root /var/www/ecommerce/frontend/public;
        access_log off;
    }

    # Spring Boot API (context-path /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
