<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pro Team · Call</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(165deg, #f3f7ff 0%, #eef8f3 50%, #f7f7f7 100%);
      color: #1a1a1a; padding: 24px;
    }
    .card {
      width: min(100%, 380px); background: #fff; border-radius: 20px;
      padding: 28px 22px; box-shadow: 0 12px 40px rgba(15, 40, 80, 0.08);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p { margin: 0 0 16px; color: #555; font-size: 0.95rem; line-height: 1.45; }
    .num {
      font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em;
      margin: 8px 0 20px; font-variant-numeric: tabular-nums;
    }
    a.btn {
      display: block; width: 100%; text-decoration: none; border-radius: 14px;
      padding: 14px 16px; font-weight: 650; font-size: 1rem; margin: 0 0 10px;
    }
    a.primary { background: #166534; color: #fff; }
    a.secondary { background: #25d366; color: #fff; }
    a.viber { background: #7360f2; color: #fff; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Customer Service Pro Team</h1>
    <p>အောက်က ခလုတ်ကို <b>နှိပ်</b>ပြီး ဆက်သွယ်ပါ</p>
    <div class="num">09775630740</div>
    <a class="btn primary" href="tel:+959775630740">📞 ဖုန်းခေါ်မယ်</a>
    <a class="btn secondary" href="https://wa.me/959775630740">💬 WhatsApp</a>
    <a class="btn viber" href="https://shop.29jewellery.com/go/viber-pro">💜 Pro Team (Viber)</a>
    <p class="hint">
      ခလုတ်မအလုပ်လုပ်ရင် ဖုန်းမှ <b>09775630740</b> ကို တိုက်ရိုက်ခေါ်ပါ။
    </p>
  </div>
</body>
</html>
