spring:
  application:
    name: sale-crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salecrm}
    username: ${DB_USERNAME:salecrm}
    password: ${DB_PASSWORD:salecrm}
    hikari:
      # Tuned for ~10 branches with concurrent traffic
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SaleCrmHikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Yangon
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: sale-crm-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.salecrm.*"

  jackson:
    time-zone: Asia/Yangon
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
    max-connections: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  # Laravel shop_sales MySQL (shared during migration). Off by default so local PG-only still boots.
  legacy-mysql:
    enabled: ${LEGACY_MYSQL_ENABLED:false}
    url: ${LEGACY_MYSQL_URL:jdbc:mysql://127.0.0.1:3307/shop_sales?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Yangon}
    username: ${LEGACY_MYSQL_USERNAME:shop_sale_java}
    password: ${LEGACY_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${LEGACY_MYSQL_POOL_MAX:10}
      minimum-idle: ${LEGACY_MYSQL_POOL_MIN:2}
      pool-name: LegacyShopSalesHikari
  security:
    jwt:
      # Override in production via env; must be a Base64 secret >= 256 bits
      secret: ${JWT_SECRET:c2FsZS1jcm0tc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL:120}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
      issuer: sale-crm
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  kafka:
    topics:
      crm-history-events: crm-history-events
      audit-events: audit-events
  public:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  product:
    image-dir: ${PRODUCT_IMAGE_DIR:./data/products}
  showcase:
    image-dir: ${SHOWCASE_IMAGE_DIR:./data/showcase}
  shop:
    google-client-id: ${SHOP_GOOGLE_CLIENT_ID:}
  backup:
    dir: ${BACKUP_DIR:./data/backups}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.salecrm: ${LOG_LEVEL:INFO}
